
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a HomeCare Service</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f6;color:#18332e}
header{background:#087f6e;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h2{margin:0;font-size:21px}
button,a{cursor:pointer}
.back{background:white;color:#087f6e;border:0;padding:10px 14px;border-radius:9px;font-weight:bold}
main{max-width:600px;margin:25px auto;padding:16px}
.card{background:white;padding:24px;border-radius:18px;box-shadow:0 5px 22px #153c3210}
p{line-height:1.5;color:#637771}
label{display:block;font-weight:bold;margin:17px 0 7px}
input,select,textarea{width:100%;padding:13px;border:1px solid #d5e1dc;border-radius:10px;font:inherit;background:white}
textarea{resize:vertical}
.submit{width:100%;padding:14px;background:#087f6e;color:white;border:0;border-radius:10px;font-weight:bold;margin-top:22px}
#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <h2>🏡 HomeCare</h2>
  <a href="services.html"><button class="back">← Services</button></a>
</header>

<main>
  <section class="card">
    <h1>Book a Service 💚</h1>
    <p>Fill in your details to send a HomeCare booking request.</p>

    <form id="bookingForm">
      <label for="service">Choose Service</label>
      <select id="service" required>
        <option value="">Select a service</option>
        <option>Home Cleaning</option>
        <option>Elder Care</option>
        <option>Patient Care</option>
        <option>Nursing Care</option>
      </select>

      <label for="date">Preferred Date</label>
      <input id="date" type="date" required>

      <label for="time">Preferred Time</label>
      <input id="time" type="time" required>

      <label for="phone">Contact Phone</label>
      <input id="phone" type="tel" inputmode="tel"
             pattern="[0-9]{10}" maxlength="10"
             placeholder="10-digit phone number" required>

      <label for="address">Service Address</label>
      <textarea id="address" rows="3"
                placeholder="Enter the address where service is needed"
                required></textarea>

      <button class="submit" id="submitBtn" type="submit">
        Submit Booking Request
      </button>
    </form>

    <p id="status" role="status"></p>
  </section>
</main>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
  getFirestore, collection, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

// IMPORTANT: Copy your actual config from your working login.html.
const firebaseConfig = {
  apiKey: "AIzaSyC80FOc0oUOJwUbQtZkEZU_TnKH9JujpG0",
  authDomain: "homecare-68c01.firebaseapp.com",
  projectId: "homecare-68c01.firebasestorage.app",
  appId: "1:18183777711:web:307c5f92fa9ef00a32135a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("bookingForm");
const statusEl = document.getElementById("status");
const submitBtn = document.getElementById("submitBtn");
const serviceEl = document.getElementById("service");
const dateEl = document.getElementById("date");

const localToday = new Date();
const yyyy = localToday.getFullYear();
const mm = String(localToday.getMonth() + 1).padStart(2, "0");
const dd = String(localToday.getDate()).padStart(2, "0");
dateEl.min = `${yyyy}-${mm}-${dd}`;

const allowedServices = [
  "Home Cleaning", "Elder Care", "Patient Care", "Nursing Care"
];

const requestedService =
  new URLSearchParams(window.location.search).get("service");

if (allowedServices.includes(requestedService)) {
  serviceEl.value = requestedService;
}

let currentUser = null;

onAuthStateChanged(auth, user => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }
  currentUser = user;
  statusEl.textContent = "You are signed in. Complete the form below.";
});

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (!currentUser) {
    statusEl.textContent = "Please wait for login verification.";
    return;
  }

  const service = serviceEl.value;
  const date = dateEl.value;
  const time = document.getElementById("time").value;
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();

  if (!allowedServices.includes(service)) {
    statusEl.textContent = "Please select a valid service.";
    return;
  }

  if (date < dateEl.min) {
    statusEl.textContent = "Please select today or a future date.";
    return;
  }

  if (!/^[0-9]{10}$/.test(phone)) {
    statusEl.textContent = "Enter a valid 10-digit phone number.";
    return;
  }

  if (!address) {
    statusEl.textContent = "Please enter the service address.";
    return;
  }

  submitBtn.disabled = true;
  statusEl.textContent = "Submitting your booking request...";

  try {
    const booking = await addDoc(collection(db, "bookings"), {
      uid: currentUser.uid,
      service,
      date,
      time,
      phone,
      address,
      status: "pending",
      createdAt: serverTimestamp()
    });

    statusEl.textContent =
      "Booking request submitted! Reference: " + booking.id;
    form.reset();
  } catch (error) {
    console.error("Booking error:", error);
    statusEl.textContent =
      error.code === "permission-denied"
      ? "Booking save blocked by Firestore Rules. We need to update the rules."
      : "Booking could not be saved. Please check your connection and try again.";
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>

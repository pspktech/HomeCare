
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f67">
  <title>HomeCare | Create Account</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e7f7f1, #eaf0ff);
      color: #18352f;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 12px 35px #18352f18;
    }

    h1 { margin: 0 0 8px; color: #087f67; }
    p { color: #65736f; line-height: 1.5; }

    label {
      display: block;
      margin-top: 14px;
      font-size: 14px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 7px;
      border-radius: 10px;
      font-size: 16px;
    }

    input { border: 1px solid #d7e2de; }

    button {
      margin-top: 20px;
      border: 0;
      background: #087f67;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }
    #message { overflow-wrap: anywhere; font-size: 14px; }
    a { color: #087f67; }
  </style>
</head>

<body>
  <main class="card">
    <h1>HomeCare 🩺</h1>
    <p>Create your HomeCare account.</p>

    <form id="registerForm">
      <label for="name">Full name</label>
      <input id="name" type="text" maxlength="80"
        autocomplete="name" required>

      <label for="email">Email address</label>
      <input id="email" type="email"
        autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        minlength="8" autocomplete="new-password" required>

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password"
        minlength="8" autocomplete="new-password" required>

      <button id="registerBtn" type="submit">
        Create Account
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p>Already registered? <a href="login.html">Login</a></p>
    <p><a href="index.html">← Back to Home</a></p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile,
      sendEmailVerification,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    // IMPORTANT: Keep your existing, correct Firebase config here.
    const firebaseConfig = {
      apiKey: "AIzaSyC80FOc0oUOJwUbQtZkEZU_TnKH9JujpG0",
      authDomain: "homecare-68c01.firebaseapp.com",
      projectId: "homecare-68c01",
      appId: "1:18183777711:web:307c5f92fa9ef00a32135a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (!name) {
        message.textContent = "Please enter your name.";
        return;
      }

      if (password.length < 8) {
        message.textContent =
          "Password must be at least 8 characters.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";

      let createdUser = null;

      try {
        const result = await createUserWithEmailAndPassword(
          auth, email, password
        );

        createdUser = result.user;

        await updateProfile(createdUser, {
          displayName: name
        });

        // Save profile in Firestore under the authenticated user's UID.
        await setDoc(doc(db, "users", createdUser.uid), {
          uid: createdUser.uid,
          name: name,
          email: createdUser.email,
          createdAt: serverTimestamp()
        });

        await sendEmailVerification(createdUser);
        await signOut(auth);

        message.textContent =
          "Account created! Check your email for a verification link, then log in.";

        form.reset();

      } catch (error) {
        console.error("Registration error:", error);

        const messages = {
          "auth/email-already-in-use":
            "This email already has an account. Please log in.",
          "auth/invalid-email":
            "Please enter a valid email address.",
          "auth/weak-password":
            "Choose a stronger password.",
          "auth/operation-not-allowed":
            "Email/Password sign-up is not enabled in Firebase.",
          "permission-denied":
            "Unable to save your profile. Check Firestore Rules.",
          "unavailable":
            "Service temporarily unavailable. Please try again."
        };

        message.textContent =
          messages[error.code] ||
          "Registration could not be completed. Please check your connection and Firebase settings.";

        // If profile saving fails after account creation,
        // do not delete the Authentication account automatically.
        if (createdUser) {
          try {
            await signOut(auth);
          } catch (signOutError) {
            console.error("Sign-out error:", signOutError);
          }
        }

      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeCare Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f6;
      color: #18332e;
    }
    header {
      background: #087f6e;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    header h2 { margin: 0; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: bold;
    }
    #logoutBtn { background: white; color: #087f6e; }
    main { max-width: 700px; margin: 35px auto; padding: 16px; }
    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 18px;
      box-shadow: 0 6px 24px #153c3210;
    }
    .profile-icon {
      width: 65px; height: 65px;
      display: grid; place-items: center;
      background: #d8f5ed;
      border-radius: 50%;
      font-size: 30px;
      margin-bottom: 16px;
    }
    .muted { color: #637771; overflow-wrap: anywhere; }
    #status { color: #087f6e; }
    @media(max-width: 420px) {
      header { padding: 15px; }
      header h2 { font-size: 19px; }
      #logoutBtn { padding: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <h2>🏡 HomeCare</h2>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <section class="card">
      <div class="profile-icon">👋</div>
      <h1>Welcome to HomeCare!</h1>
      <p class="muted">Your personal care dashboard.</p>
      <p id="status">Loading your profile...</p>
    </section>

<section class="card">
  <h3>My Profile</h3>
  <p><strong>Name:</strong> <span id="userName">Loading...</span></p>
  <p><strong>Email:</strong> <span id="userEmail">Loading...</span></p>
  <p><strong>Email verified:</strong> <span id="verified">Checking...</span></p>
</section>

<section class="card">
  <h3>Our Services 🏡</h3>
  <p>Explore HomeCare services for your family.</p>
  <a href="services.html">
    <button style="background:#087f6e;color:white;">
      Explore Services →
    </button>
  </a>
</section>

  </main>
  
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getAuth, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    import {
      getFirestore, doc, getDoc
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    // Use the SAME real config from your working login.html.
    const firebaseConfig = {
      apiKey: "AIzaSyC80FOc0oUOJwUbQtZkEZU_TnKH9JujpG0",
      authDomain: "homecare-68c01.firebaseapp.com",
      projectId: "homecare-68c01",
      appId: "1:18183777711:web:307c5f92fa9ef00a32135a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const statusEl = document.getElementById("status");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }

      document.getElementById("userEmail").textContent =
        user.email || "Not available";

      document.getElementById("verified").textContent =
        user.emailVerified ? "Yes" : "No";

      try {
        const profileRef = doc(db, "users", user.uid);
        const profileSnap = await getDoc(profileRef);

        const profile = profileSnap.exists()
          ? profileSnap.data()
          : {};

        document.getElementById("userName").textContent =
          profile.name || user.displayName || "HomeCare User";

        statusEl.textContent = "Your profile loaded successfully!";
      } catch (error) {
        console.error("Profile loading error:", error);
        document.getElementById("userName").textContent =
          user.displayName || "HomeCare User";
        statusEl.textContent =
          "Profile could not load. Please check Firestore rules.";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.replace("login.html");
      } catch (error) {
        console.error("Logout error:", error);
        alert("Logout failed. Please try again.");
      }
    });
  </script>
</body>
</html>
